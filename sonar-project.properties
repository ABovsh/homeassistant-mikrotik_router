sonar.organization=abovsh
sonar.projectKey=ABovsh_homeassistant-mikrotik_router

sonar.sources=custom_components
sonar.tests=tests
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml

# Exclude HA platform wiring files (require a running HA instance — not unit testable)
# and pure data descriptor files (no executable logic to measure).
sonar.coverage.exclusions=\
  custom_components/mikrotik_router/__init__.py,\
  custom_components/mikrotik_router/config_flow.py,\
  custom_components/mikrotik_router/diagnostics.py,\
  custom_components/mikrotik_router/binary_sensor.py,\
  custom_components/mikrotik_router/sensor.py,\
  custom_components/mikrotik_router/switch.py,\
  custom_components/mikrotik_router/device_tracker.py,\
  custom_components/mikrotik_router/button.py,\
  custom_components/mikrotik_router/update.py,\
  custom_components/mikrotik_router/binary_sensor_types.py,\
  custom_components/mikrotik_router/sensor_types.py,\
  custom_components/mikrotik_router/switch_types.py,\
  custom_components/mikrotik_router/button_types.py,\
  custom_components/mikrotik_router/device_tracker_types.py,\
  custom_components/mikrotik_router/update_types.py,\
  custom_components/mikrotik_router/iface_attributes.py,\
  custom_components/mikrotik_router/const.py,\
  custom_components/mikrotik_router/exceptions.py

# sensor_types.py and coordinator.py contain intentional structural repetition:
# - sensor_types.py: repeated sensor descriptor blocks per interface/hardware type
# - coordinator.py: same host-processing pattern repeated per data source (capsman/wireless/dhcp/arp)
# tests/ excluded: test files inherently repeat assertion patterns across test functions
sonar.cpd.exclusions=\
  custom_components/mikrotik_router/sensor_types.py,\
  custom_components/mikrotik_router/coordinator.py,\
  tests/**

# Suppressions (verified intentional / HA contracts / fork-LAN specifics):
#   e1 S7503 — HA requires async hooks even without await
#   e2 S3776 — upstream parser/coordinator complexity; refactor = high risk
#   e3 S1172 — HA diagnostics contract mandates the hass parameter
#   e4 S1313 — DEFAULT_HOST placeholder, user-overridden in config flow
#   e5 S5332 — configuration_url points at the router's LAN web UI (HTTP only)
#   e6 S4830/e7 S5527 — ssl_verify is a user option; RouterOS self-signed
#       certs have no hostname to verify
#   e8 S2068 — translation label strings, not credentials
#   e9 S7504 — list() is an intentional copy: the dict is mutated in the loop
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e1.resourceKey=custom_components/mikrotik_router/**
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=custom_components/mikrotik_router/**
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.e3.resourceKey=custom_components/mikrotik_router/**
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.e4.resourceKey=custom_components/mikrotik_router/const.py
sonar.issue.ignore.multicriteria.e5.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e5.resourceKey=custom_components/mikrotik_router/entity.py
sonar.issue.ignore.multicriteria.e6.ruleKey=python:S4830
sonar.issue.ignore.multicriteria.e6.resourceKey=custom_components/mikrotik_router/mikrotikapi.py
sonar.issue.ignore.multicriteria.e7.ruleKey=python:S5527
sonar.issue.ignore.multicriteria.e7.resourceKey=custom_components/mikrotik_router/mikrotikapi.py
sonar.issue.ignore.multicriteria.e8.ruleKey=json:S2068
