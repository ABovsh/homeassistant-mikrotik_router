name: SonarCloud

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    # Gated by repo var SONAR_ENABLED (project + token live since 2026-07-18).
    # Dependabot branches read the dependabot secret store, where SONAR_TOKEN
    # doesn't exist — the scanner would fail with "Not authorized" on every
    # bump PR. Skip instead of failing.
    if: ${{ vars.SONAR_ENABLED == 'true' && github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install pytest pytest-homeassistant-custom-component pytest-cov
          pip install mac-vendor-lookup librouteros

      - name: Run tests with coverage for SonarCloud
        run: >
          pytest --cov=custom_components/mikrotik_router
          --cov-report=xml:coverage.xml

      - name: SonarCloud Scan
        # sonarcloud-github-action is archived; sonarqube-scan-action is its successor.
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e  # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io"
